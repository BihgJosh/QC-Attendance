<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QC Observer — Streams of Joy International</title>
<link rel="manifest" href="/qc-suite-assets/manifest.json">
<meta name="theme-color" content="#020c20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SOJ QC">
<link rel="apple-touch-icon" href="/qc-suite-assets/icons/apple-touch-icon.png">
<style>
  :root {
    --blue: #4F6EF7; --purple: #9B4FF7; --grad: linear-gradient(135deg, var(--blue), var(--purple));
    --ink: #1E2233; --muted: #6B7280; --line: rgba(148, 130, 255, 0.22); --card: rgba(255, 255, 255, 0.72);
    --success-bg: #D1FAE5; --success-text: #047857; --danger-bg: #FEE2E2; --danger-text: #B91C1C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif; color: var(--ink);
    background: radial-gradient(circle at 15% 10%, rgba(79,110,247,0.14), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(155,79,247,0.14), transparent 45%),
      linear-gradient(160deg, #F6F5FF 0%, #FFFFFF 45%, #F3F0FF 100%);
    padding: 40px 16px 80px;
  }
  .wrap { max-width: 620px; margin: 0 auto; }
  .backlink { display:inline-block; margin-bottom:14px; color:var(--muted); font-size:13px; text-decoration:none; font-weight:600; }
  .hero { text-align: center; margin-bottom: 28px; }
  .crest { width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 18px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 30px rgba(120,90,255,0.25); }
  .crest svg { width: 46px; height: 46px; }
  h1 { font-size: 32px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.5px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tagline { color: var(--muted); font-size: 15px; margin: 0 0 6px; }
  .brand { color: #A6A0C4; font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
  .chip-row { display: flex; justify-content: center; gap: 12px; margin: 22px 0 16px; flex-wrap: wrap; }
  .chip { background: var(--card); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px; font-size: 14px; font-weight: 600; }
  .card { background: var(--card); backdrop-filter: blur(10px); border: 1.5px solid var(--line); border-radius: 20px; padding: 26px 24px 30px; box-shadow: 0 10px 40px rgba(120,90,255,0.10); }
  .card-title { font-size: 19px; font-weight: 800; margin: 0 0 4px; }
  .card-sub { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--purple); margin: 26px 0 12px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  label { display: block; font-size: 12.5px; font-weight: 700; color: #3A3F55; margin: 14px 0 6px; }
  input[type=text], input[type=date], select, textarea {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #E4E1F5; background: #fff; font-size: 14.5px; color: var(--ink); font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px rgba(155,79,247,0.15); }
  textarea { min-height: 60px; resize: vertical; }
  .row2 { display: flex; gap: 14px; }
  .row2 > div { flex: 1; }
  .seg-card { border: 1.5px solid #ECE9FA; border-radius: 14px; padding: 14px 16px; margin-top: 12px; background: #fff; }
  .seg-title { font-weight: 700; color: #3A3F55; font-size: 13.5px; margin-bottom: 8px; }
  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { flex: 0 0 auto; padding: 9px 14px; text-align: center; border-radius: 10px; border: 1.5px solid #E4E1F5; cursor: pointer; font-size: 12.5px; font-weight: 600; color: #4B4F66; background: #fff; }
  .pill.active { background: var(--grad); border-color: transparent; color: #fff; }
  button.submit { width: 100%; padding: 15px; margin-top: 24px; border: none; border-radius: 14px; background: var(--grad); color: #fff; font-size: 15.5px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 25px rgba(120,90,255,0.30); }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { margin-top: 16px; padding: 13px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; display: none; }
  .msg.ok { display: block; background: var(--success-bg); color: var(--success-text); }
  .msg.err { display: block; background: var(--danger-bg); color: var(--danger-text); }
  .required { color: #DC2626; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
</style>
<link rel="stylesheet" href="/qc-suite-assets/shared.css?v=20260731-2">
</head>
<body>
  <div class="wrap">
    <a class="backlink" href="/service-tools">← All QC Tools</a>
    <div class="hero">
      <div class="crest"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L14 10L22 12L14 14L12 22L10 14L2 12L10 10L12 2Z" fill="url(#g)"/><defs><linearGradient id="g" x1="2" y1="2" x2="22" y2="22"><stop stop-color="#4F6EF7"/><stop offset="1" stop-color="#9B4FF7"/></linearGradient></defs></svg></div>
      <h1>Observer</h1>
      <p class="tagline">A roving report across service units, in your own words.</p>
      <div class="brand">STREAMS OF JOY INTERNATIONAL</div>
    </div>
    <div class="chip-row">
      <div class="chip">📅 <span id="chipDate">—</span></div>
      <div class="chip">🕐 <span id="chipTime">—</span></div>
    </div>
    <div class="card">
      <div class="card-title">✦ Submit Observer Report</div>
      <p class="card-sub">Cover as many units as you observed this service, in one submission.</p>
      <div class="loading" id="loading">Loading form…</div>
      <div id="content" style="display:none;"></div>
    </div>
  </div>

<script src="/qc-suite-assets/shared-shell.js?v=20260808-1"></script>
<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbxML18eWnhaTihUfNTtPCCr0mtWWj5XG_Piy7qzl21yEDvoeE_-NJO7mK9ZKSVmxiiWYQ/exec';
  const OBSERVER_API_URL = '/api/service-observer';

  let ctx = null;
  const unitTexts = {};
  let submissionId = null;
  const postingLocations = ['Outside', 'Emporium', 'Toilet', 'Children Section', 'Vendors', 'Overflow Tent', 'Main Auditorium', 'Timers', 'Service Manager'];

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function render() {
    document.getElementById('chipDate').textContent = ctx.date;
    document.getElementById('chipTime').textContent = ctx.time;

    document.getElementById('content').innerHTML = `
      <div class="section-label">Service Info</div>
      <div class="row2"><div><label for="date">Date *</label><input type="date" id="date" value="${esc(ctx.date)}" required></div>
      <div><label for="service">Service *</label><select id="service" required><option value="">Select</option>
        <option value="1st Service">1st Service</option><option value="2nd Service">2nd Service</option>
        <option value="3rd Service">3rd Service</option><option value="4th Service">4th Service</option>
        <option value="Thursday Service">Thursday Service</option></select></div></div>
      <label for="observerName">Observer Name *</label><input type="text" id="observerName" placeholder="Your name" required>

      <div class="section-label">Observation</div>
      <label for="reporterRole">Who are you? *</label><select id="reporterRole" required><option value="">Select</option><option value="Service Observer">Service Observer</option><option value="QC member">QC member</option></select>
      <div id="postedLocationWrap" hidden><label for="postedLocation">Select your posting location *</label><select id="postedLocation"><option value="">Select posting location</option>${postingLocations.map(location => `<option value="${esc(location)}">${esc(location)}</option>`).join('')}</select></div>
      <label for="reportingLocation">What location are you reporting? *</label><select id="reportingLocation" required><option value="">Select</option>${['Outside', 'Emporium', 'Toilet', 'Children Section', 'Vendors', 'Overflow', 'Main Auditorium'].map(location => `<option value="${esc(location)}">${esc(location)}</option>`).join('')}</select>
      <label for="generalObservations">General Observations</label>
      <textarea id="generalObservations" placeholder="Anything not tied to one specific unit — weather, parking, general atmosphere, etc."></textarea>
      <label for="unitPicker">Which units are you reporting on today?</label>
      <select id="unitPicker" aria-label="Unit observed"><option value="">Select a unit</option>${ctx.units.map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join('')}</select>
      <div id="unitWriteups"></div>
      <label for="recommendations">Recommendations</label><textarea id="recommendations"></textarea>
      <label for="conclusion">Conclusion / Commendations</label><textarea id="conclusion"></textarea>

      <div class="msg" id="msg" role="alert" aria-live="polite"></div>
      <button class="submit" id="submitBtn">Submit Observer Report</button>
    `;

    document.getElementById('reporterRole').addEventListener('change', e => {
      const posted = e.target.value === 'QC member';
      document.getElementById('postedLocationWrap').hidden = !posted;
      document.getElementById('postedLocation').required = posted;
      if (!posted) document.getElementById('postedLocation').value = '';
    });
    document.getElementById('unitPicker').addEventListener('change', renderUnitWriteups);
    document.getElementById('submitBtn').addEventListener('click', submit);
  }

  function renderUnitWriteups() {
    const wrap = document.getElementById('unitWriteups');
    wrap.innerHTML = unit ? `<div class="seg-card"><div class="seg-title">${esc(unit)}</div><textarea class="unit-text" data-unit="${esc(unit)}" placeholder="Observation for ${esc(unit)}">${esc(unitTexts[unit] || '')}</textarea></div>` : '';
    wrap.querySelectorAll('.unit-text').forEach(ta => {
      ta.addEventListener('input', () => { unitTexts[ta.getAttribute('data-unit')] = ta.value; });
    });
  }

  async function submit() {
    const msg = document.getElementById('msg');
    msg.className = 'msg'; msg.style.display = 'none';

    const date = document.getElementById('date').value;
    const service = document.getElementById('service').value;
    const observerName = document.getElementById('observerName').value;
    const reporterRole = document.getElementById('reporterRole').value;
    const postedLocation = document.getElementById('postedLocation').value;
    const reportingLocation = document.getElementById('reportingLocation').value;
    if (!date) { msg.className = 'msg err'; msg.textContent = 'Please select a date.'; msg.style.display = 'block'; return; }
    if (!service) { msg.className = 'msg err'; msg.textContent = 'Please select a service.'; msg.style.display = 'block'; return; }
    if (!observerName.trim()) { msg.className = 'msg err'; msg.textContent = "Please enter your name."; msg.style.display = 'block'; return; }
    if (!reporterRole) { msg.className = 'msg err'; msg.textContent = 'Please choose who you are.'; msg.style.display = 'block'; return; }
    if (reporterRole === 'QC member' && !postedLocation) { msg.className = 'msg err'; msg.textContent = 'Please select your posting location.'; msg.style.display = 'block'; return; }
    if (!reportingLocation) { msg.className = 'msg err'; msg.textContent = 'Please select the location you are reporting.'; msg.style.display = 'block'; return; }

    submissionId ||= crypto.randomUUID();
    const payload = {
      submissionId,
      date, service, observerName, reporterRole, postedLocation, reportingLocation,
      generalObservations: document.getElementById('generalObservations').value,
      unitsReported: Object.entries(unitTexts).filter(([, value]) => value.trim()).map(([unit]) => unit),
      unitReports: unitTexts,
      recommendations: document.getElementById('recommendations').value,
      conclusion: document.getElementById('conclusion').value
    };

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Submitting…';

    try {
      const res = await fetch(OBSERVER_API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: AbortSignal.timeout(30000) });
      const result = await res.json().catch(() => ({ ok: false, message: `The server returned an invalid response (${res.status}).` }));
      if (result.ok) {
        submissionId = null;
        QCSubmissionResult.show({ status: 'success', title: 'Observer report submitted', message: result.message || 'Your observer report has been saved successfully.' });
      } else {
        QCSubmissionResult.show({ status: 'error', title: 'Observer report not saved', message: result.message || 'The server could not save this report. Please retry.', onRetry: submit });
      }
    } catch (err) {
      QCSubmissionResult.show({ status: 'error', title: 'Connection interrupted', message: err?.name === 'TimeoutError' ? 'The server took too long to respond. Your entries are still here; please retry.' : 'Could not reach the server. Check your connection and try again.', onRetry: submit });
    } finally {
      btn.disabled = false; btn.textContent = 'Submit Observer Report';
    }
  }

  async function init() {
    try {
      const res = await fetch(API_URL + '?action=getContext');
      ctx = await res.json();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      render();
    } catch (err) {
      document.getElementById('loading').innerHTML = 'Could not load the form. Check the API_URL is set correctly.';
    }
  }
  init();
</script>
<script src="/qc-suite-assets/emergency-notify.js?v=20260731-2" defer></script>
<script src="/qc-suite-assets/pwa.js" defer></script>
</body>
</html>
